spring.application.name=api

#Configuração do banco de dados PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração JPA / Hibernate
spring.jpa.database-plataform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Permite acesso pela rede local do celular/Expo
server.address=0.0.0.0
server.port=8080


# Configuração JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8100}

# Configuração log

logging.level.org.springframework.security=TRACE

# Log global
logging.level.root=INFO

# Log para Spring Security
logging.level.br.com.senai.aula=DEBUG

# Log em arquivo
logging.file.name=logs/spring-security.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Actuator
#management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.include=*

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.placeholders.schema=public
spring.flyway.baseline-version=0

# Cardápio digital (QR Code)
cardapio.nome-estabelecimento=${CARDAPIO_NOME_ESTABELECIMENTO:Easy Eats}
cardapio.aceita-delivery=${CARDAPIO_ACEITA_DELIVERY:true}
cardapio.aceita-retirada=${CARDAPIO_ACEITA_RETIRADA:true}

# Integração WhatsApp (módulo integracao.whatsapp). Provedor: evolution (Evolution API), http (genérico) ou log.
# Com habilitado=false as mensagens só vão para o log.
integracao.whatsapp.habilitado=${WHATSAPP_HABILITADO:false}
integracao.whatsapp.provedor=${WHATSAPP_PROVEDOR:evolution}
integracao.whatsapp.url=${WHATSAPP_API_URL:}
integracao.whatsapp.token=${WHATSAPP_API_TOKEN:}
integracao.whatsapp.instancia=${WHATSAPP_INSTANCIA:}
integracao.whatsapp.numero-loja=${WHATSAPP_NUMERO_LOJA:}
integracao.whatsapp.notificar-cliente=${WHATSAPP_NOTIFICAR_CLIENTE:true}
integracao.whatsapp.ddi-padrao=${WHATSAPP_DDI_PADRAO:55}
