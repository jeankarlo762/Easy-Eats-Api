# Build e push das imagens do Easy Eats (banco, backend, frontend) para o
# Docker Hub, no repositório <DOCKERHUB_USERNAME>/easy-eats — criado
# automaticamente no primeiro push.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  usuário do Docker Hub
#   DOCKERHUB_TOKEN     Access Token (Docker Hub > Account settings > Personal access tokens, Read & Write)
name: Docker - publicar imagens

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Branch do repositório Easy-Eats (frontend) a usar no build
        default: develop

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Só para o compose interpolar o arquivo; não vão para as imagens.
      DB_PASSWORD: build-only
      JWT_SECRET: build-only
    steps:
      - name: Checkout da API
        uses: actions/checkout@v4
        with:
          path: Easy-Eats-Api

      - name: Checkout do frontend
        uses: actions/checkout@v4
        with:
          repository: jeankarlo762/Easy-Eats
          ref: ${{ github.event.inputs.frontend_ref || (github.ref_name == 'main' && 'master' || 'develop') }}
          path: Easy-Eats

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push (tag = branch e commit)
        working-directory: Easy-Eats-Api/docker
        run: |
          for TAG in "${GITHUB_REF_NAME//\//-}" "${GITHUB_SHA::7}"; do
            export TAG
            docker compose build
            docker compose push
          done
